<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Closet Kit promo</title>
<style>
:root{--bg:#13111c;--surface:#1c1929;--line:#2f2a45;--text:#eeeaff;--muted:#a59fbd;--accent:#9b83ff;--accent2:#c4b5ff;--accent-ink:#13111c;--ok:#4ed1a0;--pink:#ff8fd8;--discord:#5865f2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
body{font-family:"Noto Sans CJK KR","Noto Sans CJK JP",sans-serif;-webkit-font-smoothing:antialiased}
html[lang=ja] body{font-family:"Noto Sans CJK JP","Noto Sans CJK KR",sans-serif}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
.layer{position:absolute;inset:0}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#bokeh i{position:absolute;border-radius:50%;filter:blur(7px)}
#blbg{position:absolute;inset:-80px;width:calc(100% + 160px);height:calc(100% + 160px);object-fit:cover;filter:blur(30px) brightness(.42) saturate(1.25)}
#bl{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#sweep{position:absolute;top:-20%;bottom:-20%;width:45%;background:linear-gradient(100deg,transparent 0%,rgba(255,255,255,0) 30%,rgba(255,255,255,.16) 50%,rgba(255,255,255,0) 70%,transparent 100%);mix-blend-mode:screen}
#iris{position:absolute;border-radius:50%;border:8px solid var(--accent);box-shadow:0 0 40px rgba(155,131,255,.8),inset 0 0 30px rgba(155,131,255,.5)}
#dot{position:absolute;border-radius:50%;background:var(--accent);box-shadow:0 0 30px rgba(155,131,255,.9)}
.big{font-weight:700;letter-spacing:-.03em;line-height:1.18}
/* 글자 단위 마스크 */
.ln{display:block;overflow:hidden;padding:.06em .08em .12em;margin:-.06em -.08em -.12em;white-space:nowrap}
.ch{display:inline-block;white-space:pre;transform-origin:50% 100%}
.mk{position:relative;display:inline-block;color:var(--accent)}
.mk .bar{position:absolute;left:-.12em;right:-.12em;bottom:.12em;height:.34em;background:rgba(155,131,255,.32);border-radius:.08em;transform-origin:left center}
.mk .ln{position:relative}
.brand{position:absolute;display:flex;align-items:center;gap:14px;font-weight:700;letter-spacing:-.02em}
.logo{border-radius:12px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:68%;height:68%;overflow:visible}
.chip{display:inline-flex;align-items:center;gap:.3em;background:var(--surface);border:2px solid var(--line);border-radius:999px;font-weight:700;white-space:nowrap;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.chip .e{display:inline-block}
.chip .st{position:absolute;left:.5em;right:.5em;top:52%;height:.11em;border-radius:.06em;background:var(--pink);transform-origin:left center;box-shadow:0 0 12px rgba(255,143,216,.7)}
.tag{display:inline-block;background:var(--accent);color:var(--accent-ink);border-radius:999px;font-weight:700;white-space:nowrap;box-shadow:0 8px 24px rgba(155,131,255,.35)}
#s3bar{position:absolute;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--pink));transform-origin:left center;box-shadow:0 0 18px rgba(155,131,255,.6)}
/* 작업물 */
#pfgrid{display:grid}
.pf{position:relative;border-radius:18px;overflow:hidden;border:3px solid rgba(155,131,255,.85);box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 30px rgba(155,131,255,.25);background:#dcdce6}
.pf img{display:block;width:100%;height:100%;object-fit:cover;transform-origin:50% 60%}
.pf .cap{position:absolute;left:14px;bottom:12px;background:rgba(19,17,28,.82);color:#fff;border-radius:999px;padding:.28em .8em;font-weight:700;white-space:nowrap;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
/* 엔드카드 */
.dcpill{display:inline-flex;align-items:center;gap:.4em;background:var(--discord);color:#fff;border-radius:999px;font-weight:700;position:relative;overflow:hidden;box-shadow:0 12px 40px rgba(88,101,242,.45)}
.dcpill svg{width:1.15em;height:1.15em;flex:none}
.dcpill .shine{position:absolute;top:-30%;bottom:-30%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent)}
.cursor{display:inline-block;width:.07em;height:1em;background:#fff;margin-left:.04em;vertical-align:-.12em}
.credit{position:absolute;left:0;right:0;text-align:center;color:var(--muted);padding:0 40px}
.bar3{position:absolute;top:-25%;height:150%;transform:skewX(-16deg)}
#vignette{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 52%,rgba(0,0,0,.5) 100%);pointer-events:none}
#grain{mix-blend-mode:overlay;opacity:.09;background-repeat:repeat}
</style>
</head>
<body>

      <div id="s5dc"><span class="dcpill"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.32 4.37A19.8 19.8 0 0 0 15.4 2.8a13.7 13.7 0 0 0-.63 1.29 18.4 18.4 0 0 0-5.53 0 12.6 12.6 0 0 0-.64-1.29 19.7 19.7 0 0 0-4.92 1.53C.56 9.04-.29 13.6.13 18.1a19.9 19.9 0 0 0 6.03 3.05 14.7 14.7 0 0 0 1.29-2.1 12.9 12.9 0 0 1-2.03-.98l.5-.39a14.2 14.2 0 0 0 12.16 0l.5.39c-.65.39-1.33.71-2.04.98.37.74.8 1.44 1.29 2.1a19.8 19.8 0 0 0 6.04-3.05c.5-5.22-.84-9.74-3.55-13.73ZM8.02 15.33c-1.18 0-2.16-1.08-2.16-2.42s.95-2.42 2.16-2.42c1.21 0 2.18 1.09 2.16 2.42 0 1.34-.96 2.42-2.16 2.42Zm7.97 0c-1.18 0-2.15-1.08-2.15-2.42s.95-2.42 2.15-2.42c1.21 0 2.18 1.09 2.16 2.42 0 1.34-.95 2.42-2.16 2.42Z"/></svg><span id="dcid"></span><span class="cursor"></span><span class="shine"></span></span></div>
      <div id="s5url" style="color:var(--muted);font-weight:700;letter-spacing:.01em">closetkit.github.io</div>
    </div>
  </div>

  <div class="layer" id="wipe"><div class="bar3" style="background:var(--accent)"></div><div class="bar3" style="background:var(--accent2)"></div><div class="bar3" style="background:var(--bg)"></div></div>
  <div class="credit" id="credit"></div>
  <div class="brand" id="brand"><div class="logo"><svg viewBox="0 0 64 64"><path d="M20 18h24l6 10-8 4v18H22V32l-8-4z" fill="#13111c"/></svg></div>Closet Kit</div>
  <div class="layer" id="vignette"></div>
  <div class="layer" id="grain"></div>
</div>

<script>
var Q = new URLSearchParams(location.search);
var ASPECT = Q.get('aspect') || 'v', LANG = Q.get('lang') || 'ko';
var V = ASPECT === 'v';
document.documentElement.lang = LANG;
var FPS = 30, N = 540, B0 = 180, BN = 150;   // 3D 샷: 180~329 프레임 (6.0~11.0s)
var W = V ? 1080 : 1920, H = V ? 1920 : 1080;
var DISCORD = 'blackrikka';

var TXT = {
  ko: {
    s1a: 'BOOTH에서 산 옷,', s1b: '아직 못 입혔나요?',
    chips: [['🩷', '옷이 분홍색'], ['😇', '소품이 안 꺼져요'], ['📦', '용량 초과'], ['🧩', '메뉴가 엉켜요']],
    s2c: '전부, 맡겨 주세요.',
    s3a: V ? '산 옷,\n입혀 드립니다.' : '산 옷, 입혀 드립니다.',
    s4h: '작업물',
    works: ['시나노 × Project-KATANA', '루루네 × SAMEHOLIC', '라슈샤 × Phantom Flare Ensemble', '쇼콜라 × 엘펠트'],
    sub: 'VRChat 옷 입히기 커미션', lab: '견적은 디스코드로',
    credit: '작업물 이미지의 아바타·의상 저작권은 각 제작자에게 있습니다.'
  },
  ja: {
    s1a: 'BOOTHで買った衣装、', s1b: 'まだ着せられてない？',
    chips: [['🩷', '衣装がピンク'], ['😇', '小物が消えない'], ['📦', '容量オーバー'], ['🧩', 'メニューが混乱']],
    s2c: 'ぜんぶ、任せてください。',
    s3a: V ? '買った衣装、\n着せます。' : '買った衣装、着せます。',
    s4h: '制作実績',
    works: ['しなの × Project-KATANA', 'ルルネ × SAMEHOLIC', 'ラシューシャ × Phantom Flare Ensemble', 'ショコラ × エルフェルト'],
    sub: 'VRChat 衣装の着せ替え・改変代行', lab: 'お見積りはDiscordで',
    credit: '制作実績画像のアバター・衣装の著作権は各制作者に帰属します。'
  },
  en: {
    s1a: 'Bought outfits on BOOTH', s1b: 'but still can’t wear them?',
    chips: [['🩷', 'Outfit turns pink'], ['😇', 'Props won’t turn off'], ['📦', 'Over the size limit'], ['🧩', 'Tangled menus']],
    s2c: 'Leave it to Closet Kit.',
    s3a: V ? 'Your outfits,\nfitted for you.' : 'Your outfits, fitted for you.',
    s4h: 'Portfolio',
    works: ['Shinano × Project-KATANA', 'Rurune × SAMEHOLIC', 'Lasyusha × Phantom Flare Ensemble', 'Chocolat × Elphelt'],
    sub: 'VRChat outfit setup commissions', lab: 'Get a quote on Discord',
    credit: 'Avatar and outfit copyrights belong to their respective creators.'
  }
}[LANG];
var TAGS = ['VRChat', 'Modular Avatar', 'BOOTH'];

// 비율별 크기
var SZ = V ? { s1: 104, chip: 58, s2c: 86, s3a: 98, tag: 46, s4h: 88, pfw: 960, cap: 32, name: 124, logo: 128, sub: 50, lab: 44, dc: 70, url: 40, credit: 26, brand: 44, blogo: 58 }
           : { s1: 112, chip: 46, s2c: 88, s3a: 86, tag: 38, s4h: 76, pfw: 880, cap: 28, name: 104, logo: 104, sub: 42, lab: 36, dc: 56, url: 32, credit: 24, brand: 34, blogo: 46 };

function $(id){ return document.getElementById(id); }
// 글자 단위로 쪼개기: 줄마다 마스크(.ln) 안에 .ch
function kin(el, text){
  var chars = [];
  text.split('\n').forEach(function(line){
    var ln = document.createElement('span'); ln.className = 'ln';
    Array.from(line).forEach(function(c){ var s = document.createElement('span'); s.className = 'ch'; s.textContent = c; ln.appendChild(s); chars.push(s); });
    el.appendChild(ln);
  });
  return chars;
}

// --- 내용 채우기 ---
$('s1a').style.fontSize = $('s1b').style.fontSize = SZ.s1 + 'px';
var K1a = kin($('s1a'), TXT.s1a), K1b = kin($('s1b'), TXT.s1b);
$('s2c').style.fontSize = SZ.s2c + 'px'; $('s2c').style.marginTop = (V ? 80 : 50) + 'px';
var K2c = kin($('s2c'), TXT.s2c);
$('chips').style.gap = (V ? 26 : 18) + 'px';
if (!V) { $('chips').style.flexDirection = 'row'; $('chips').style.flexWrap = 'wrap'; $('chips').style.justifyContent = 'center'; $('chips').style.maxWidth = '1840px'; }
var CH = TXT.chips.map(function(c){
  var d = document.createElement('div'); d.className = 'chip';
  d.style.fontSize = SZ.chip + 'px'; d.style.padding = (V ? '20px 38px' : '16px 30px');
  d.innerHTML = '<span class="e"></span><span class="t"></span><span class="st"></span>';
  d.querySelector('.e').textContent = c[0]; d.querySelector('.t').textContent = c[1];
  $('chips').appendChild(d); return d;
});
$('s3a').style.fontSize = SZ.s3a + 'px'; $('s3a').style.top = (V ? 190 : 46) + 'px';
var K3 = kin($('s3a'), TXT.s3a);
$('s3tags').style.gap = '16px'; $('s3tags').style.bottom = (V ? 340 : 60) + 'px';
var TG = TAGS.map(function(t){ var d = document.createElement('span'); d.className = 'tag'; d.textContent = t; d.style.fontSize = SZ.tag + 'px'; d.style.padding = V ? '14px 30px' : '12px 26px'; $('s3tags').appendChild(d); return d; });

$('s4h').style.fontSize = SZ.s4h + 'px';
var K4 = kin($('s4h'), TXT.s4h);
var grid = $('pfgrid');
grid.style.gap = (V ? 26 : 24) + 'px'; grid.style.marginTop = (V ? 50 : 34) + 'px';
grid.style.gridTemplateColumns = V ? SZ.pfw + 'px' : 'repeat(2,' + SZ.pfw + 'px)';
var PF = TXT.works.map(function(name, i){
  var d = document.createElement('div'); d.className = 'pf';
  d.style.width = SZ.pfw + 'px'; d.style.height = (SZ.pfw / 4) + 'px';
  d.innerHTML = '<img src="panels/p' + i + '.jpg" alt=""><span class="cap"></span>';
  var cap = d.querySelector('.cap'); cap.textContent = name; cap.style.fontSize = SZ.cap + 'px';
  grid.appendChild(d); return { el: d, img: d.querySelector('img'), cap: cap };
});

$('s5logo').style.gap = (V ? 26 : 22) + 'px';
var box = $('s5box'); box.style.width = box.style.height = SZ.logo + 'px'; box.style.borderRadius = Math.round(SZ.logo * .27) + 'px';
$('s5name').style.fontSize = SZ.name + 'px';
var K5 = kin($('s5name'), 'Closet Kit');
$('s5sub').style.fontSize = SZ.sub + 'px'; $('s5sub').style.marginTop = '20px'; $('s5sub').textContent = TXT.sub;
$('s5lab').style.fontSize = SZ.lab + 'px'; $('s5lab').style.marginTop = (V ? 84 : 52) + 'px'; $('s5lab').textContent = TXT.lab;
var pill = $('s5dc').firstChild; pill.style.fontSize = SZ.dc + 'px'; pill.style.padding = V ? '22px 52px 22px 40px' : '18px 42px 18px 32px';
$('s5dc').style.marginTop = (V ? 22 : 16) + 'px';
$('s5url').style.fontSize = SZ.url + 'px'; $('s5url').style.marginTop = (V ? 40 : 28) + 'px';
$('credit').style.fontSize = SZ.credit + 'px'; $('credit').style.bottom = (V ? 300 : 34) + 'px'; $('credit').textContent = TXT.credit;
var br = $('brand'); br.style.fontSize = SZ.brand + 'px'; br.style.left = (V ? 56 : 60) + 'px'; br.style.top = (V ? 120 : 46) + 'px';
var bl0 = br.querySelector('.logo'); bl0.style.width = bl0.style.height = SZ.blogo + 'px';
$('scrim').style.background = V ? 'linear-gradient(to bottom,rgba(19,17,28,.94) 0%,rgba(19,17,28,0) 26%,rgba(19,17,28,0) 68%,rgba(19,17,28,.94) 100%)'
                                : 'linear-gradient(to bottom,rgba(19,17,28,.9) 0%,rgba(19,17,28,0) 24%,rgba(19,17,28,0) 76%,rgba(19,17,28,.9) 100%)';
var BARS = Array.from(document.querySelectorAll('.bar3'));
BARS.forEach(function(b){ b.style.width = (W * 1.9) + 'px'; });
$('sweep').style.left = '0';

// --- 보케 (결정적 난수) ---
var seed = 11; function rnd(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
var bok = [], cols = ['#9b83ff', '#c4b5ff', '#ff8fd8', '#7fb4ff'];
for (var i = 0; i < 28; i++) {
  var e = document.createElement('i'), r = 12 + rnd() * 52;
  e.style.width = e.style.height = (r * 2) + 'px'; e.style.background = cols[i % 4];
  $('bokeh').appendChild(e);
  bok.push({ e: e, x: rnd() * W, y: rnd() * H, r: r, vx: (rnd() - .5) * 22, vy: -8 - rnd() * 26, a: .14 + rnd() * .32, ph: rnd() * 6.28, z: .5 + rnd() });
}

// --- 이징 ---
function clamp(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }
function p(t, a, b){ return clamp((t - a) / (b - a)); }
function eo(x){ return 1 - Math.pow(1 - x, 3); }
function eo5(x){ return 1 - Math.pow(1 - x, 5); }
function ei(x){ return x * x * x; }
function eio(x){ return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
function spring(x){ return x >= 1 ? 1 : 1 - Math.exp(-6.5 * x) * Math.cos(11 * x); }
function back(x){ var c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
function lerp(a, b, x){ return a + (b - a) * x; }
function tf(el, o, x, y, s, rot, blur){
  el.style.opacity = o;
  el.style.transform = 'translate(' + (x || 0) + 'px,' + (y || 0) + 'px) scale(' + (s == null ? 1 : s) + ') rotate(' + (rot || 0) + 'deg)';
  el.style.filter = blur > .05 ? 'blur(' + blur.toFixed(2) + 'px)' : 'none';
}
// 글자: tin 부터 stagger 간격으로 아래→위로 등장, tout 부터 위로 퇴장
function kinAnim(chars, t, tin, stg, dur, tout, stgO, durO){
  chars.forEach(function(c, i){
    var q = eo5(p(t, tin + i * stg, tin + i * stg + dur));
    var o = tout == null ? 0 : ei(p(t, tout + i * stgO, tout + i * stgO + durO));
    c.style.transform = 'translateY(' + ((1 - q) * 108 - o * 108).toFixed(2) + '%) rotate(' + ((1 - q) * 9 - o * 6).toFixed(2) + 'deg)';
    c.style.opacity = clamp(q * 1.4) * (1 - o);
    var b = (1 - q) * 8 + o * 8;
    c.style.filter = b > .05 ? 'blur(' + b.toFixed(2) + 'px)' : 'none';
  });
}
function pad(n){ return ('000' + n).slice(-4); }

// --- 측정 (처음 한 번, 변형 적용 전) ---
var M = null;
function measure(){
  // 화면 폭(좌우 여백 60px)을 넘는 문구는 글자 크기를 줄여 맞춤
  ['s1a', 's1b', 's2c', 's3a', 's4h', 's5name', 's5sub', 's5lab'].forEach(function(id){
    var el = $(id), w = 0, lns = el.querySelectorAll('.ln');
    if (lns.length) Array.from(lns).forEach(function(ln){ var s = 0; Array.from(ln.children).forEach(function(c){ s += c.getBoundingClientRect().width; }); w = Math.max(w, s); });
    else w = el.scrollWidth;
    if (w > W - 120) el.style.fontSize = (parseFloat(el.style.fontSize) * (W - 120) / w).toFixed(1) + 'px';
  });
  // 칩 줄도 화면을 넘으면 전체 크기를 줄임
  if (!V) { var cw = 0; CH.forEach(function(c){ cw += c.getBoundingClientRect().width + 18; }); if (cw > W - 200) CH.forEach(function(c){ c.style.fontSize = (SZ.chip * (W - 200) / cw).toFixed(1) + 'px'; }); }
  else CH.forEach(function(c){ var w = c.getBoundingClientRect().width; if (w > W - 120) c.style.fontSize = (SZ.chip * (W - 120) / w).toFixed(1) + 'px'; });
  M = { chips: CH.map(function(c){ var r = c.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }) };
  var last = $('s3a').lastChild.getBoundingClientRect();
  var lw = 0; Array.from($('s3a').lastChild.children).forEach(function(c){ lw += c.getBoundingClientRect().width; });
  var bw = Math.min(lw, W - 120);
  $('s3bar').style.width = bw + 'px'; $('s3bar').style.left = ((W - bw) / 2) + 'px'; $('s3bar').style.top = (last.bottom + 10) + 'px';
}

var bl = $('bl'), blbg = $('blbg'), blFrame = -1, grainIdx = -1;
blbg.src = 'blend/' + ASPECT + '/' + pad(BN) + '.png';
var SWAP = 11.03;   // 색 막대가 화면을 덮는 순간 3D → 작업물로 교체

window.seek = async function(f){
  if (!M) { await document.fonts.ready; measure(); }
